  version: '7.4'
  template_groups:
    - uuid: 26b0b8ed7f8c4a0e9c7c2a0c9d6c5a11
      name: Templates/Applications
  templates:
    - uuid: 39cc630e39f241deacd1579c72aa882f
      template: 'Zabbix Server Housekeeper Stats by Zabbix Agent Active'
      name: 'Zabbix Server Housekeeper Stats by Zabbix Agent Active'
      description: |
        Zabbix Server Housekeeper statistics
        
        by diasdm
        https://github.com/diasdmhub/Zabbix_Out_of_The_Box/
      vendor:
        name: diasdm
        version: 7.4-15
      groups:
        - name: Templates/Applications
      items:
        - uuid: 6afdec0122f844d79549d8995399b73e
          name: 'Housekeeper Log Statistics'
          type: ZABBIX_ACTIVE
          key: 'log["/var/log/zabbix/zabbix_server.log","housekeeper\s\[(.*)\]$",,,skip,"\1"]'
          delay: 10m
          history: '0'
          value_type: LOG
          description: 'Master item that collects housekeeper log messages'
          logtimefmt: 'pppppp:yyyyMMdd:hhmmss.nnn'
          tags:
            - tag: Log
              value: Housekeeper
        - uuid: 687ca83601274c9283136cd23c1c3563
          name: 'Service Alarm Records Deleted'
          type: DEPENDENT
          key: 'zabbix.housekeeper.del[alarms]'
          history: 30d
          description: 'Number of rows deleted from the service_alarms table (SLA and service status history)'
          preprocessing:
            - type: REGEX
              parameters:
                - '(\d+) alarms,'
                - \1
          master_item:
            key: 'log["/var/log/zabbix/zabbix_server.log","housekeeper\s\[(.*)\]$",,,skip,"\1"]'
          tags:
            - tag: Housekeeper
              value: Alarms
        - uuid: d61326af25fb4ed7b44c29dd575d591d
          name: 'Audit Records Deleted'
          type: DEPENDENT
          key: 'zabbix.housekeeper.del[audit]'
          history: 30d
          description: 'Number of deleted audit log rows that are older than the configured audit log settings'
          preprocessing:
            - type: REGEX
              parameters:
                - '(\d+) audit,'
                - \1
          master_item:
            key: 'log["/var/log/zabbix/zabbix_server.log","housekeeper\s\[(.*)\]$",,,skip,"\1"]'
          tags:
            - tag: Housekeeper
              value: Audit
        - uuid: 07f8766567cc49e7936fdbeaf5d64cf6
          name: 'Autoregistration Host Records Deleted'
          type: DEPENDENT
          key: 'zabbix.housekeeper.del[autoreg_host]'
          history: 30d
          description: 'Number of deleted autoregistration host entries for hosts that no longer exist and for which no autoregistration event exists'
          preprocessing:
            - type: REGEX
              parameters:
                - '(\d+) autoreg_host,'
                - \1
          master_item:
            key: 'log["/var/log/zabbix/zabbix_server.log","housekeeper\s\[(.*)\]$",,,skip,"\1"]'
          tags:
            - tag: Housekeeper
              value: Autoreg_host
        - uuid: aa0693fbb2e546beb0e48d50e5e182f0
          name: 'Event Records Deleted'
          type: DEPENDENT
          key: 'zabbix.housekeeper.del[events]'
          history: 30d
          description: |
            Number of old events deleted from each source (trigger, internal, discovery, autoregistration, service).
            
            Events that are still referenced by an open problem, recovery or a symptom are kept.
            Rows that depend on these events, such as alerts and acknowledgments, are removed by database cascade and are not counted here.
          preprocessing:
            - type: REGEX
              parameters:
                - '(\d+) events,'
                - \1
          master_item:
            key: 'log["/var/log/zabbix/zabbix_server.log","housekeeper\s\[(.*)\]$",,,skip,"\1"]'
          tags:
            - tag: Housekeeper
              value: Events
        - uuid: c812f043a9e54e58824b8cb3dc60ba9f
          name: 'History and Trend Records Deleted'
          type: DEPENDENT
          key: 'zabbix.housekeeper.del[history]'
          history: 30d
          description: |
            Number of deleted rows in the history and trends tables older than each items storage period, or the global override
            
            If TimescaleDB partition dropping is in use, the history and trends are removed by dropping chunks, and those deletions are not reflected as row counts in hist/trends
          preprocessing:
            - type: REGEX
              parameters:
                - '(\d+) hist/trends,'
                - \1
          master_item:
            key: 'log["/var/log/zabbix/zabbix_server.log","housekeeper\s\[(.*)\]$",,,skip,"\1"]'
          tags:
            - tag: Housekeeper
              value: History
            - tag: Housekeeper
              value: Trends
        - uuid: 64dc9eb5f6f041258df975e1dd250166
          name: 'Item and Trigger Records Deleted'
          type: DEPENDENT
          key: 'zabbix.housekeeper.del[items]'
          history: 30d
          description: |
            Number of deleted history, trends and internal problems left over from deleted items, triggers, LLD rules and services
            
            The frontend queues this work in the housekeeper table, which is then processed in the next cycle
          preprocessing:
            - type: REGEX
              parameters:
                - '(\d+) items/triggers,'
                - \1
          master_item:
            key: 'log["/var/log/zabbix/zabbix_server.log","housekeeper\s\[(.*)\]$",,,skip,"\1"]'
          tags:
            - tag: Housekeeper
              value: Items
            - tag: Housekeeper
              value: Triggers
        - uuid: fa667d99798347429d0cb9d263d9c5d6
          name: 'Problem Records Deleted'
          type: DEPENDENT
          key: 'zabbix.housekeeper.del[problems]'
          history: 30d
          description: 'Number of deleted resolved problems whose recovery time is more than 24 hours old and that are not the cause of another problem'
          preprocessing:
            - type: REGEX
              parameters:
                - '(\d+) problems,'
                - \1
          master_item:
            key: 'log["/var/log/zabbix/zabbix_server.log","housekeeper\s\[(.*)\]$",,,skip,"\1"]'
          tags:
            - tag: Housekeeper
              value: Problems
        - uuid: df5b53ec968c49b5b3e80ff173b78e3c
          name: 'Records Deleted'
          type: DEPENDENT
          key: 'zabbix.housekeeper.del[records]'
          history: 30d
          description: |
            Number of deleted old network discovery results received from proxies.
            
            proxy_dhistory is a temporary table that holds hosts and services found by discovery rules that are waiting to be processed.
            It should normally be close to empty on the server.
            Housekeeper deletes any row older than 24 hours.
            The retention is fixed in the code and has no frontend setting.
            In practice, the value is almost always 0.
            A non-zero value means that stale discovery data was piling up.
            
            src/zabbix_server/housekeeper/housekeeper_server.c
          preprocessing:
            - type: REGEX
              parameters:
                - '(\d+) records,'
                - \1
          master_item:
            key: 'log["/var/log/zabbix/zabbix_server.log","housekeeper\s\[(.*)\]$",,,skip,"\1"]'
          tags:
            - tag: Housekeeper
              value: Records
        - uuid: 8efd26c10a8f41d7b3e1a2b14f5de4fd
          name: 'Session Records Deleted'
          type: DEPENDENT
          key: 'zabbix.housekeeper.del[sessions]'
          history: 30d
          description: 'Number of deleted Frontend and API sessions whose last access is older than the configured period'
          preprocessing:
            - type: REGEX
              parameters:
                - '(\d+) sessions,'
                - \1
          master_item:
            key: 'log["/var/log/zabbix/zabbix_server.log","housekeeper\s\[(.*)\]$",,,skip,"\1"]'
          tags:
            - tag: Housekeeper
              value: Sessions
        - uuid: c1fbc74c30ea4c5b8752c5c7f2a52da0
          name: 'Sets Deleted'
          type: DEPENDENT
          key: 'zabbix.housekeeper.del[sets]'
          history: 30d
          description: |
            Number of deleted orphaned permission sets.
            
            Zabbix does not store user-group-to-host-group permissions pair by pair.
            Instead it groups them into "sets":
            - ugset: a unique combination of user groups. Users are linked to it through user_ugset.
            - hgset: a unique combination of host groups. Hosts are linked to it through host_hgset.
            - permission: the access level that one ugset has on one hgset.
            
            When users or hosts change groups, some sets end up with no user or host linked to them.
            
            In one transaction, Housekeeper deletes the following:
            1. permission rows whose ugset or hgset is no longer used;
            2. ugset_group and ugset rows that no user references;
            3. hgset_group and hgset rows that no host references.
            
            This step runs at most once a week, counted from when the housekeeper process started.
            It is skipped in every other run and reports 0, which is expected most of the time.
            You should only see an occasional non-zero spike.
          preprocessing:
            - type: REGEX
              parameters:
                - '(\d+) sets in'
                - \1
          master_item:
            key: 'log["/var/log/zabbix/zabbix_server.log","housekeeper\s\[(.*)\]$",,,skip,"\1"]'
          tags:
            - tag: Housekeeper
              value: sets
        - uuid: d3b5d96d538c45bd813f01ed9297ed81
          name: 'Execution Time'
          type: DEPENDENT
          key: 'zabbix.housekeeper.exec[time]'
          history: 30d
          value_type: FLOAT
          units: s
          description: 'Execution time of the last execution of the Zabbix Housekeeper process'
          preprocessing:
            - type: REGEX
              parameters:
                - 'in (\d+.\d+) sec,'
                - \1
          master_item:
            key: 'log["/var/log/zabbix/zabbix_server.log","housekeeper\s\[(.*)\]$",,,skip,"\1"]'
          tags:
            - tag: Housekeeper
              value: Time
          triggers:
            - uuid: 8042276c7b764d5e9d68ba4e53b68146
              expression: 'trendavg(/Zabbix Server Housekeeper Stats by Zabbix Agent Active/zabbix.housekeeper.exec[time],24h:now/h)>{$HOUSEKEEPER.TIME.WARN}'
              name: 'Housekeeper execution time is High'
              opdata: 'Last execution time: {ITEM.LASTVALUE}'
              priority: WARNING
              description: 'Zabbix Housekeeper average execution time for the last 24h is higher than the configured warning limit'
              tags:
                - tag: Time
                  value: high
